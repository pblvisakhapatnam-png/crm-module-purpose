# Static server for the production build (TE-5): serves the React bundle and sends /api to the
# FastAPI backend. Built into the image by frontend/Dockerfile.nginx. The development image
# (frontend/Dockerfile) is unchanged and still serves with `vite preview`.

# Behind the hosted pilot's shared Basic Auth login, the browser's Authorization header carries
# that login, which the proxy in front checks and removes. The pages therefore send their own
# sign-in token in X-PBL-Authorization (src/perimeter.ts); put it back where the backend reads it.
# Without that header, Authorization passes through untouched, so the image also works with no
# perimeter in front.
map $http_x_pbl_authorization $pbl_upstream_authorization {
    ""      $http_authorization;
    default $http_x_pbl_authorization;
}

# The scheme the browser used: as the proxy in front reports it (Traefik sets X-Forwarded-Proto), or
# this server's own when nothing is in front. The hosted pilot's backend trusts it from nginx
# (FORWARDED_ALLOW_IPS in deploy/uat/docker-compose.yml), so an address the backend builds, such as
# FastAPI's trailing-slash redirect, keeps the browser's https instead of pointing to http.
map $http_x_forwarded_proto $pbl_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # The application accepts uploads up to 25 MiB (MAX_UPLOAD_BYTES in
    # backend/app/modules/documents/contract.py). Allow a little more, so that a file just over the
    # limit is refused by the backend in the application's own words rather than by nginx.
    client_max_body_size 26m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving the backend per request rather than once at start-up means
    # the backend container can be recreated on its own without nginx keeping a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Unauthenticated diagnostics defined in backend/app/main.py. The pages never call them, and
    # they describe the database connection, so the hosted site does not serve them.
    location /api/platform/ {
        return 404;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $pbl_forwarded_proto;
        proxy_set_header Authorization $pbl_upstream_authorization;
        proxy_set_header X-PBL-Authorization "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Built assets carry a content hash in their names, so a name never changes meaning.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page application: any other path is a client-side route, so serve index.html and let
    # the router decide. index.html itself is never cached, so a redeploy is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
